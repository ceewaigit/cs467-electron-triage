      - /tmp/gh-aw/sandbox/firewall/logs:/var/log/squid:rw
    healthcheck:
      test:
        - CMD
        - nc
        - -z
        - localhost
        - '3128'
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s
    ports:
      - 3128:3128
    restart: on-failure:3
