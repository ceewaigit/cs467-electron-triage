# Guards for changes to the triage agent. Runs the skill and config tests on every push and PR.
# No secrets, no AI, read-only token.
name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Skill script and workflow config tests
        run: python3 -m unittest discover -s tests -v
      - name: Compiled locks match their sources
        # The lock is what Actions runs; a hand edit or a stale compile fails here.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-aw --pin v0.93.2
          for wf in issue-triage issue-triage-codex; do
            gh aw compile "$wf" --strict --no-check-update
          done
          git diff --exit-code .github/workflows/
      - name: Baseline still scores (scorer and cases are intact)
        # Writes to a scratch namespace so the stored historical baseline is never overwritten.
        run: python3 evals/tools/baseline.py --out baseline-ci && python3 evals/tools/score.py --runs baseline-ci --k 1
