# Alerts the owner when a finished triage run's requested writes are not on its issue, for
# example labels withheld after threat detection failed (scripts/check_triage_run.py).
# No secrets, no AI. Runs from the default branch after every run of either triage workflow.
name: Triage watchdog
on:
  workflow_run:
    workflows: ["Issue triage", "Issue triage (Codex copy)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Triage run to check
        required: true
        type: string
      issue_number:
        description: "Issue number, for runs whose title does not name it (before run titles did)"
        required: false
        type: string
permissions:
  actions: read   # the run, its jobs, approvals and artifacts
  contents: read
  issues: write   # read the issue; open an alert issue
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Compare requested and delivered writes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          ISSUE: ${{ inputs.issue_number }}
          ALERT_ASSIGNEE: ${{ github.repository_owner }}
        run: python3 scripts/check_triage_run.py
